# Woodpecker CI (ci.metabolomics.us) -- the autospec-baselines gate.
#
# Replaces the TeamCity build configuration `Autospec_Baselines_Validate`
# ("autospec-baselines validate"), which itself replaced the retired
# .github/workflows/validate.yml. TeamCity is not touched by this commit; the
# operator cuts it over once this check is trusted.
#
# Exec hosts are Slurm jobs on Rocky 9 nodes running inside one Apptainer
# image per workflow (`woodpecker/images/ci.sif`, Debian trixie), so:
#
#  * `image:` is a HOST executable, not a container image: `bash` runs the
#    job's own shell. There is no docker, no apt and no sudo.
#  * The clone plugin fails invisibly on this backend (no step logs for
#    plugins), so skip_clone + a plain git checkout step, with the forge
#    credential staged by the agent at /etc/woodpecker-git-credentials.
#  * The agent reproducibly drops a step's final log chunk, so the gate
#    script prints its journal path FIRST and tees everything to it. This
#    repository's gate finishes in seconds, which is exactly the case that
#    loses its log.
#
# The cross-repo half of this build -- fetching autospec-constitution so that
# every `constitutionReferences` id is resolved against the real doctrine
# rather than against memory -- needs NO credential: both repositories are
# public, and the gate downloads the constitution tarball from
# codeload.github.com over unauthenticated HTTPS. The forge credential the
# agent stages is used by the checkout step above and nowhere else. No
# Woodpecker secret has to be created for this repository.
#
# The step logic is in this repo (ops/ci/woodpecker-gates.sh) rather than in
# this file, so a check changes in the same commit as what it covers and so
# it can be run by hand: `bash ops/ci/woodpecker-gates.sh` from a clean
# checkout reproduces CI with no Woodpecker-specific input.
when:
  - event: [push, pull_request, manual]

skip_clone: true

steps:
  - name: checkout
    image: bash
    commands:
      - 'set -eu'
      - 'test -r /etc/woodpecker-git-credentials || { echo "the job staged no forge credential" >&2; exit 1; }'
      - 'git init -q -b "${CI_COMMIT_BRANCH:-main}" .'
      - 'git remote add origin "https://github.com/${CI_REPO}.git"'
      - 'git fetch --no-tags --depth=1 origin "$CI_COMMIT_SHA"'
      - 'git checkout -q FETCH_HEAD'
      - 'git --no-pager log --oneline -1'

  - name: gates
    image: bash
    commands:
      - 'set -eu'
      - 'bash ops/ci/woodpecker-gates.sh'
